name: QUEENEE CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: node --check server.js
      - run: npm start > /tmp/queenee.log 2>&1 &
      - run: sleep 2 && curl --fail http://127.0.0.1:3000/health
