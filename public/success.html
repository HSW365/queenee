<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order confirmed — QUEENEE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--s1:#101018;--s2:#15151f;--line:#23232f;--t:#f3f4f8;--m:#9a9cb0;--c:#22d3ee;--v:#a855f7;--y:#fbbf24;--ok:#34d399;--r:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 Inter,system-ui,sans-serif;padding:40px 16px}
.box{max-width:680px;margin:0 auto}.logo{font:800 26px 'Barlow Condensed';letter-spacing:.04em;color:var(--t);text-decoration:none}.logo span{color:var(--c)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:28px;margin-top:22px}
h1{font:800 clamp(40px,7vw,60px)/.95 'Barlow Condensed';text-transform:uppercase;margin:10px 0 12px}
.grad{background:linear-gradient(95deg,var(--c),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font:12px 'Space Mono';letter-spacing:.18em;color:var(--c);text-transform:uppercase}
.m{color:var(--m)}.mono{font-family:'Space Mono'}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}.row span:last-child{font-family:'Space Mono';text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font:12px 'Space Mono';border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#34d39966}.pill.wait{color:var(--y);border-color:#fbbf2466}.pill.bad{color:#fecaca;border-color:#ef444466}
.btn{display:inline-block;margin-top:16px;padding:13px 20px;border-radius:10px;background:linear-gradient(110deg,var(--c),var(--v));color:#07070b;font-weight:700;text-decoration:none}
ol{padding-left:20px;color:#d0d2de}ol li{margin:8px 0}
.dots{display:flex;gap:6px;margin-top:10px}.dots i{flex:1;height:8px;border-radius:9px;background:var(--s2);border:1px solid var(--line)}.dots i.on{background:var(--c);border-color:var(--c)}
</style>
</head>
<body><main class="box">
<a class="logo" href="/">QUEEN<span>EE</span></a>
<div class="card" id="main"><div class="eyebrow">Checking your order</div><h1>One moment...</h1><p class="m">Confirming your payment with Stripe.</p></div>
</main>
<script>
(async function(){
  const q=new URLSearchParams(location.search), main=document.getElementById('main');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(!q.get('order')||!q.get('t')){main.innerHTML='<div class="eyebrow">Order</div><h1>Link incomplete</h1><p class="m">Check your email receipt or contact <a style="color:var(--c)" href="mailto:hsw365media@gmail.com">hsw365media@gmail.com</a>.</p>';return}
  let tries=0,o;
  async function load(){
    const r=await fetch('/api/orders/'+encodeURIComponent(q.get('order'))+'?t='+encodeURIComponent(q.get('t'))+(q.get('session_id')?'&session_id='+encodeURIComponent(q.get('session_id')):''));
    if(!r.ok)throw Error('Order not found');return r.json();
  }
  try{
    o=await load();
    while(o.status==='pending_payment'&&tries++<8){await new Promise(r=>setTimeout(r,2500));o=await load()}
  }catch(e){main.innerHTML='<div class="eyebrow">Order</div><h1>We could not load this order</h1><p class="m">'+esc(e.message)+'. If you were charged, email <a style="color:var(--c)" href="mailto:hsw365media@gmail.com">hsw365media@gmail.com</a> with your receipt.</p>';return}
  const paid=o.status!=='pending_payment'&&o.status!=='payment_processing';
  let h='<div class="eyebrow">Order '+esc(o.id)+'</div>';
  h+=paid?'<h1>You are in. <span class="grad">Let\'s build.</span></h1><p class="m">Payment confirmed for <b style="color:var(--t)">'+esc(o.business)+'</b>. A copy of your receipt is on its way to '+esc(o.email)+'.</p>'
         :'<h1>Payment <span class="grad">processing</span></h1><p class="m">Stripe is still confirming your payment. This page updates on refresh, and you will get an email receipt once it clears.</p>';
  h+='<div style="margin-top:18px"><div class="row"><span>'+(o.website.type==='new'?'New business website':'Website rebuild')+(o.website.url?' / '+esc(o.website.url):'')+'</span><span>'+esc(o.website.price)+'</span></div>';
  if(o.calltwin){h+='<div class="row"><span>CallTwin add-on</span><span>'+esc(o.calltwin.paymentsMade)+' of '+esc(o.calltwin.totalPayments)+' payments</span></div>'}
  h+='<div class="row"><span>'+(o.comp?'Owner account':'Paid today')+'</span><span>'+(o.comp?'COMP':esc(o.dueToday))+'</span></div></div>';
  main.innerHTML=h;
  let n='<div class="card"><div class="eyebrow">What happens next</div><ol><li>We review your business details and reach out if we need your logo, photos or copy.</li><li>We build your site and send you a private preview link.</li><li>You approve or request changes.</li><li>We connect your domain and launch.</li></ol></div>';
  if(o.calltwin){
    const ct=o.calltwin, st=ct.status==='active'?['ok','ACTIVE']:ct.status==='past_due'?['bad','PAYMENT DUE']:['wait',paid?'ACTIVATING':'AWAITING PAYMENT'];
    let dots='';for(let i=0;i<ct.totalPayments;i++)dots+='<i class="'+(i<ct.paymentsMade?'on':'')+'"></i>';
    n+='<div class="card"><div class="eyebrow">CallTwin / 24/7 AI receptionist</div><p style="margin:10px 0 4px">Status <span class="pill '+st[0]+'">'+st[1]+'</span></p>'
     +'<div class="dots" aria-label="Payment plan progress">'+dots+'</div><p class="m" style="font-size:14px">Payment '+esc(ct.paymentsMade)+' of '+esc(ct.totalPayments)+'. The plan stops automatically after the last payment.</p>'
     +'<p class="m" style="font-size:14px">Log in with <b style="color:var(--t)">'+esc(o.email)+'</b> and the password you created at checkout. API address: <span class="mono" style="color:var(--t)">'+esc(ct.apiBase)+'</span></p>'
     +(ct.accountReady?'':'<p class="m" style="font-size:14px">Your CallTwin login is being finalized. We will email you as soon as it is ready.</p>')
     +'<a class="btn" href="'+esc(ct.dashboardUrl)+'" target="_blank" rel="noopener">Open CallTwin dashboard</a></div>';
  }
  main.insertAdjacentHTML('afterend',n);
})();
</script>
</body></html>
